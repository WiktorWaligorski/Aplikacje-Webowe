<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteka online</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <img src="/logo.png" alt="Logo biblioteki">
    <h1>Biblioteka online</h1>
    <nav>
      <a href="/books">Książki</a>
      <a href="/add">Dodaj książkę</a>
      <a href="/about">O aplikacji</a>
    </nav>
  </header>

  <main>
    <h2>Dostępne książki</h2>

    <form class="search" id="search-form" style="display:flex">
      <input type="text" id="search-input" placeholder="Szukaj po tytule...">
      <button type="submit">Szukaj</button>
      <button type="button" id="reset-btn">Pokaż wszystkie</button>
    </form>

  </main>
</body>
</html>
